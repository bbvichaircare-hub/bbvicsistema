name: Publicar no Firebase

# So roda quando alguem aciona manualmente (aba Actions > "Publicar no Firebase" > Run workflow).
# Nunca publica sozinho ao enviar codigo.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: 'O que publicar'
        required: true
        default: 'regras'
        type: choice
        options:
          - regras          # so as regras do Firestore (firestore.rules)
          - site            # so o site (Hosting)
          - regras-e-site

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      PROJECT_ID: bbvic-gestao-premium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Credencial do Firebase (segredo do GitHub)
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "Falta o segredo FIREBASE_SERVICE_ACCOUNT no GitHub." && exit 1
          fi
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Compilar o site
        if: inputs.alvo != 'regras'
        run: |
          npm ci --no-audit --no-fund
          npx vite build

      - name: Publicar regras do Firestore
        if: inputs.alvo != 'site'
        run: npx --yes firebase-tools@13.29.0 deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive

      - name: Publicar site (Hosting)
        if: inputs.alvo != 'regras'
        run: npx --yes firebase-tools@13.29.0 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Apagar credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

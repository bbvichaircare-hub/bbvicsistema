name: Auditoria de faturas (somente leitura)

# Le o banco e imprime totais. Nao altera nenhum dado.
# So roda quando acionado manualmente (aba Actions > Run workflow).
on:
  workflow_dispatch:

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credencial do Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Rodar auditoria
        run: |
          mkdir -p /tmp/aud && cp scripts/auditoria-faturas.mjs /tmp/aud/ && cd /tmp/aud
          npm init -y >/dev/null && npm install --no-audit --no-fund firebase-admin@12.7.0 >/dev/null
          node auditoria-faturas.mjs
      - name: Apagar credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
